[package]
name = "small-lisp"
version = "0.1.0"
edition = "2021"

[dependencies]
ctrlc = "3"
regex = "1"
serde_json = "1"
ureq = "2"
unicode-segmentation = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
